services:
  - type: web
    name: smartserve-pos
    runtime: python
    plan: free
    rootDir: smartserve-pos
    buildCommand: pip install -r backend/requirements.txt && npm --prefix frontend ci && npm --prefix frontend run build
    startCommand: cd backend && uvicorn cloud:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_API_URL
        value: ""
      - key: DATABASE_URL
        sync: false
      - key: SMARTSERVE_ENV
        value: production
      - key: SMARTSERVE_AUTH_SECRET
        generateValue: true
      - key: SMARTSERVE_PLATFORM_ADMIN_EMAIL
        sync: false
      - key: SMARTSERVE_BOOTSTRAP_ADMIN
        value: "true"
      - key: SMARTSERVE_PUBLIC_ORIGIN
        value: https://smartserve-pos-ycbj.onrender.com
      - key: MAIL_PROVIDER
        value: gmail_api
      - key: GMAIL_SENDER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
